<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17644b">
<title>Текст в файл</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--surface:#fffdf8;--ink:#1d1c18;--muted:#625d4e;--line:#d8d2c2;--accent:#17644b;--accent-ink:#ffffff;--bad:#a3281f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1211;--surface:#151b19;--ink:#e8e2d0;--muted:#a8a28d;--line:#2a3330;--accent:#43b890;--accent-ink:#06100c;--bad:#ff8a7e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1211;--surface:#151b19;--ink:#e8e2d0;--muted:#a8a28d;--line:#2a3330;--accent:#43b890;--accent-ink:#06100c;--bad:#ff8a7e;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:1rem}
main{max-width:46rem;margin:0 auto;display:grid;gap:.9rem}
h1{font-size:1.35rem;margin:.2rem 0 0}
p{margin:0;color:var(--muted)}
label{display:grid;gap:.35rem;font-weight:600;font-size:.9rem}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.75rem}
textarea{min-height:50vh;resize:vertical}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;min-height:2.9rem;padding:0 1.2rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button[hidden]{display:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{min-height:1.4rem;font-size:.95rem}
#status.err{color:var(--bad)}
#count{margin-left:auto;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Текст в файл</h1>
<p>Вставьте текст, задайте имя и нажмите «Сохранить файл». Текст остаётся на вашем устройстве и никуда не отправляется. После первой загрузки страница работает без интернета.</p>
<label>Текст
<textarea id="text" placeholder="Вставьте сюда текст…" spellcheck="false"></textarea>
</label>
<label>Имя файла
<input id="name" value="text.txt" autocomplete="off" autocapitalize="off">
</label>
<div class="row">
<button id="save" class="primary" type="button" disabled>Сохранить файл</button>
<button id="share" type="button" hidden disabled>Поделиться…</button>
<button id="clear" type="button">Очистить</button>
<span id="count">0 симв.</span>
</div>
<div id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
  var ta=document.getElementById('text'), nm=document.getElementById('name'), save=document.getElementById('save'),
      share=document.getElementById('share'), clear=document.getElementById('clear'),
      st=document.getElementById('status'), cnt=document.getElementById('count');
  function say(t,err){st.textContent=t;st.className=err?'err':'';}
  function upd(){cnt.textContent=ta.value.length.toLocaleString('ru-RU')+' симв.';save.disabled=!ta.value.length;share.disabled=!ta.value.length;}
  function fname(){var n=nm.value.trim()||'text.txt';if(!/\.[A-Za-z0-9]+$/.test(n)){n+='.txt';}return n;}
  ta.addEventListener('input',upd);
  clear.addEventListener('click',function(){ta.value='';upd();say('');ta.focus();});
  save.addEventListener('click',function(){
    if(!ta.value){return;}
    var n=fname();
    var url=URL.createObjectURL(new Blob([ta.value],{type:'text/plain;charset=utf-8'}));
    var a=document.createElement('a');
    a.href=url;a.download=n;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},5000);
    say('Файл отправлен в загрузки: ищите его в папке «Загрузки». Если ничего не произошло, нажмите «Поделиться…».');
  });
  share.addEventListener('click',async function(){
    if(!ta.value){return;}
    var n=fname();
    try{
      await navigator.share({files:[new File([ta.value],n,{type:'text/plain'})],title:n});
      say('Готово.');
    }catch(e){
      if(!(e&&e.name==='AbortError')){say('Не удалось открыть меню «Поделиться».',true);}
    }
  });
  try{
    if(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.txt',{type:'text/plain'})]})){share.hidden=false;}
  }catch(e){}
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
  upd();
})();
</script>
</body>
</html>
